services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: familytree
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytree}"]
      interval: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - familyvine

  # Creates SuperTokens' database if it's missing, then exits. It runs on every deploy,
  # so it also works on an existing data volume (Postgres only runs
  # /docker-entrypoint-initdb.d scripts when the volume is brand new) and it doesn't
  # depend on mounting a file from the repository, which Coolify doesn't provide.
  db-init:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-familytree}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: familytree
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'supertokens'" | grep -q 1
        || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE supertokens"
    restart: "no"
    # Coolify extension: this service exits once done, so don't count it towards the
    # resource's health (see https://coolify.io/docs/applications/builds/docker-compose).
    exclude_from_hc: true
    networks:
      - familyvine

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/supertokens
    restart: unless-stopped
    networks:
      - familyvine

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_started
    environment:
      FT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/familytree
      FT_SUPERTOKENS_URI: http://supertokens:3567
      FT_SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      # Frontend and API are served from the same origin (nginx proxies /api to this
      # service), so both domains are this app's public URL (see PUBLIC_URL below).
      FT_WEBSITE_DOMAIN: ${PUBLIC_URL:?set PUBLIC_URL to this app's public URL}
      FT_API_DOMAIN: ${PUBLIC_URL:?set PUBLIC_URL to this app's public URL}
      FT_MEDIA_DIR: /data/media
    volumes:
      # Uploaded photos. Back this up along with the database.
      - media:/data/media
    restart: unless-stopped
    networks:
      - familyvine

  web:
    build: ./frontend
    depends_on:
      - backend
    # No Coolify-managed domain/proxy for this service: exposure is handled directly
    # via this host port (see docs/DEPLOY.md for the Tailscale Funnel setup). Give
    # dev and production distinct WEB_PORT values so both can run on one host.
    ports:
      - "${WEB_PORT:?set WEB_PORT}:80"
    restart: unless-stopped
    networks:
      - familyvine

networks:
  # Declared explicitly (rather than relying on Compose's implicit default network)
  # because Coolify doesn't always place every service of a Docker Compose resource
  # on the same implicit network, which breaks service-name DNS resolution (e.g.
  # supertokens/backend failing to reach "db").
  familyvine:

volumes:
  pgdata:
  media:
