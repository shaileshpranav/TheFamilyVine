server {
    listen 80;

    location /api/ {
        # Room for photo uploads (the API itself refuses anything over 15 MB).
        client_max_body_size 20m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their names, so a name never changes meaning.
    # A missing one is a real 404, not the app page.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page, service worker and manifest are checked on every load, so a deploy
    # reaches the installed app straight away (it then offers "Reload").
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
